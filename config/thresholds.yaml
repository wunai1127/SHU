# =============================================================================
# 心脏移植/机械灌注 - 特征阈值配置文件
# =============================================================================
# 置信度等级: high(高), medium(中), low(低), pending(待定)
# 状态: confirmed(已确认), provisional(暂定), pending(待验证)
# =============================================================================

version: "3.0.0"
last_updated: "2025-01-29"
update_notes: "整合心脏移植共识文献知识：新增移植特异性阈值(PVR/TPG/PAP/肌酐/GFR/胆红素/冷缺血/PeakVO2)，更新已有指标共识阈值"

# -----------------------------------------------------------------------------
# 1. 心功能指标 (Cardiac Function)
# -----------------------------------------------------------------------------
cardiac_function:
  # 射血分数 (Ejection Fraction)
  EF:
    name: "射血分数"
    name_en: "Ejection Fraction"
    unit: "%"
    confidence: high
    status: confirmed
    source:
      - "ISHLT Guidelines"
      - "Clinical consensus"
    thresholds:
      accept:
        operator: ">"
        value: 50
        description: "可接受"
      reject:
        operator: "<"
        value: 40
        description: "拒绝"
      gray_zone:
        min: 45
        max: 50
        description: "灰区，需综合评估"
    baseline_reference: 55
    notes: "心脏移植供体评估核心指标"

  # 心脏指数 (Cardiac Index)
  CI:
    name: "心脏指数"
    name_en: "Cardiac Index"
    unit: "L/min/m²"
    confidence: medium
    status: confirmed
    source:
      - "Hemodynamic guidelines"
      - "Critical care standards"
    thresholds:
      target:
        min: 2.2
        max: 2.8
        description: "目标范围"
      red_line:
        operator: "<"
        value: 2.0
        description: "红线，需干预"
      warning:
        operator: "<"
        value: 2.2
        description: "警戒"
    baseline_reference: 2.5
    escalation_rule: "CI < 2.0 且复苏无效 → 正性肌力药物"

# -----------------------------------------------------------------------------
# 2. 血压指标 (Blood Pressure)
# -----------------------------------------------------------------------------
blood_pressure:
  # 平均动脉压 (Mean Arterial Pressure)
  MAP:
    name: "平均动脉压"
    name_en: "Mean Arterial Pressure"
    unit: "mmHg"
    confidence: high
    status: confirmed
    source:
      - "Hemodynamic guidelines"
      - "Critical care standards"
      - "中国心脏移植共识2019 - 心脏外科学ch21"
    thresholds:
      target:
        min: 65
        max: 80
        description: "目标范围"
      cpb_minimum:
        operator: ">="
        value: 40
        description: "复温期CPB最低灌注压（共识）"
      red_line:
        operator: "<"
        value: 60
        description: "红线"
    baseline_reference: 70
    escalation_rule: "MAP<60→血管活性药; CPB期间MAP≥40mmHg"
    notes: "共识：复温期CPB最低MAP≥40mmHg，CPB流速4.2-4.8L/min"

  # 主动脉压 (Aortic Pressure) - OCS系统
  AOP:
    name: "主动脉压"
    name_en: "Aortic Pressure"
    unit: "mmHg"
    confidence: high
    status: confirmed
    source:
      - "Prot_000 OCS Protocol"
      - "OCS操作手册"
    thresholds:
      operating_range:
        min: 40
        max: 100
        description: "OCS操作范围"
      warning:
        operator: "<"
        value: 70
        description: "警告线"
    baseline_reference: 75

# -----------------------------------------------------------------------------
# 3. 氧代谢指标 (Oxygen Metabolism)
# -----------------------------------------------------------------------------
oxygen_metabolism:
  # 混合静脉血氧饱和度
  SvO2:
    name: "混合静脉血氧饱和度"
    name_en: "Mixed Venous Oxygen Saturation"
    unit: "%"
    confidence: medium
    status: confirmed
    source:
      - "Critical care guidelines"
      - "Hemodynamic monitoring standards"
    thresholds:
      target:
        operator: ">="
        value: 65
        description: "目标"
      red_line:
        operator: "<"
        value: 60
        description: "红线"
      critical:
        operator: "<"
        value: 50
        description: "危急值，联合CI下降需升级支持"
    baseline_reference: 70
    escalation_rule: "SvO2 < 50% + CI下降 → 升级支持（正性肌力/肺血管扩张 ± MCS）"

  # 静脉血氧分压
  pO2V:
    name: "静脉血氧分压"
    name_en: "Venous Partial Pressure of Oxygen (Mixed Venous)"
    unit: "mmHg"
    confidence: medium
    status: confirmed
    source:
      - "BMC Pulmonary Medicine 2022"
      - "Deranged Physiology - Mixed venous oxygen"
      - "Radiometer Blood Gas Reference"
    thresholds:
      target:
        min: 35
        max: 45
        description: "正常范围（典型值~40 mmHg）"
      warning:
        operator: "<"
        value: 35
        description: "组织缺氧警告"
      red_line:
        operator: "<"
        value: 32
        description: "早期循环不足，需立即评估"
    baseline_reference: 40
    notes: "与SvO2 70-75%对应，<32 mmHg提示组织灌注不足"

  # 静脉血氧含量
  CvO2:
    name: "静脉血氧含量"
    name_en: "Venous Oxygen Content"
    unit: "mL/dL"
    confidence: medium
    status: confirmed
    source:
      - "NCBI StatPearls - Venous Oxygen Saturation"
      - "OpenAnesthesia - CV Physiology"
      - "McGraw Hill AccessAnesthesiology"
    thresholds:
      target:
        min: 14
        max: 16
        description: "正常范围（典型值~15 mL/dL）"
      warning:
        operator: "<"
        value: 12
        description: "氧摄取增加，需关注"
      red_line:
        operator: "<"
        value: 10
        description: "严重组织缺氧"
    baseline_reference: 15
    notes: "CaO2-CvO2差值正常4-6 mL/dL，氧提取率正常25-35%"

# -----------------------------------------------------------------------------
# 4. 代谢指标 (Metabolic)
# -----------------------------------------------------------------------------
metabolic:
  # 乳酸
  Lactate:
    name: "乳酸"
    name_en: "Lactate"
    unit: "mmol/L"
    confidence: high
    status: confirmed
    source:
      - "OCS Protocol"
      - "Critical care guidelines"
      - "Organ preservation standards"
    thresholds:
      accept:
        operator: "<"
        value: 5
        description: "可接受"
      reject:
        operator: ">"
        value: 5
        description: "不合格"
      ideal:
        operator: "<"
        value: 2
        description: "理想"
      warning:
        operator: ">"
        value: 4
        description: "警戒"
    baseline_reference: 1.5
    notes: "器官灌注质量核心指标；OCS接受标准：<5 mmol/L且趋势稳定"

# -----------------------------------------------------------------------------
# 4.1 电解质指标 (Electrolytes)
# -----------------------------------------------------------------------------
electrolytes:
  # 动脉钾离子
  K_A:
    name: "动脉钾离子"
    name_en: "Arterial Potassium"
    unit: "mmol/L"
    confidence: high
    status: confirmed
    source:
      - "JACC 2003 - Optimal serum potassium in cardiovascular patients"
      - "ACC 2020 - Abnormalities of Potassium in Heart Failure"
      - "NCBI StatPearls - Potassium"
      - "PMC ICU potassium studies"
    thresholds:
      target:
        min: 4.0
        max: 5.0
        description: "ICU/心血管患者最佳范围"
      normal:
        min: 3.5
        max: 5.0
        description: "正常范围"
      warning_low:
        operator: "<"
        value: 3.5
        description: "低钾警戒，心律失常风险"
      warning_high:
        operator: ">"
        value: 5.5
        description: "高钾警戒"
      red_line_low:
        operator: "<"
        value: 3.0
        description: "严重低钾，紧急处理"
      red_line_high:
        operator: ">"
        value: 6.0
        description: "严重高钾，心律失常/心脏骤停风险"
      critical:
        operator: ">"
        value: 6.5
        description: "危急值，需紧急处理"
    baseline_reference: 4.2
    notes: "钾异常可致室性心律失常；ICU目标4.0-5.0 mmol/L"

  # 动脉钠离子
  Na_A:
    name: "动脉钠离子"
    name_en: "Arterial Sodium"
    unit: "mmol/L"
    confidence: high
    status: confirmed
    source:
      - "Critical Care 2012 - Hyponatraemia and hypernatraemia"
      - "JAHA - Abnormal Serum Sodium in Cardiac ICU"
      - "Acute Care Testing - Critical values for sodium"
    thresholds:
      target:
        min: 135
        max: 145
        description: "正常范围"
      warning_low:
        operator: "<"
        value: 130
        description: "低钠警戒"
      warning_high:
        operator: ">"
        value: 150
        description: "高钠警戒"
      red_line_low:
        operator: "<"
        value: 125
        description: "严重低钠，神经症状风险"
      red_line_high:
        operator: ">"
        value: 155
        description: "严重高钠"
      critical_low:
        operator: "<"
        value: 120
        description: "危急值低钠"
      critical_high:
        operator: ">"
        value: 160
        description: "危急值高钠"
    baseline_reference: 140
    notes: "低钠/高钠均增加ICU死亡率；纠正速度<12 mmol/day防止渗透性脱髓鞘"

  # 动脉血糖
  GluA:
    name: "动脉血糖"
    name_en: "Arterial Glucose"
    unit: "mmol/L"
    confidence: high
    status: confirmed
    source:
      - "ADA 2025 - Diabetes Care in Hospital"
      - "SCCM Guidelines - Glycemic Control for Critically Ill"
      - "NEJM NICE-SUGAR Trial"
    thresholds:
      target:
        min: 7.8
        max: 10.0
        description: "ICU目标范围（140-180 mg/dL）"
      hyperglycemia:
        operator: ">"
        value: 10.0
        description: "高血糖，考虑胰岛素治疗"
      severe_hyperglycemia:
        operator: ">"
        value: 13.9
        description: "严重高血糖（>250 mg/dL）"
      hypoglycemia_level1:
        operator: "<"
        value: 3.9
        description: "低血糖1级（<70 mg/dL）"
      hypoglycemia_level2:
        operator: "<"
        value: 3.0
        description: "低血糖2级（<54 mg/dL），神经低糖症状"
      critical_low:
        operator: "<"
        value: 2.2
        description: "严重低血糖（≤40 mg/dL）"
    baseline_reference: 8.0
    notes: "ICU目标7.8-10 mmol/L；严格控制（<7.8）反而增加死亡率（NICE-SUGAR）"

# -----------------------------------------------------------------------------
# 5. 心率指标 (Heart Rate)
# -----------------------------------------------------------------------------
heart_rate:
  HR:
    name: "心率"
    name_en: "Heart Rate"
    unit: "bpm"
    confidence: high
    status: confirmed
    source:
      - "Clinical standards"
    thresholds:
      warning_range:
        min: 110
        max: 120
        description: "警戒范围"
      target:
        min: 60
        max: 100
        description: "正常范围"
    baseline_reference: 80

# -----------------------------------------------------------------------------
# 6. 肺血管指标 (Pulmonary Vascular)
# -----------------------------------------------------------------------------
pulmonary_vascular:
  # 肺血管阻力
  PVR:
    name: "肺血管阻力"
    name_en: "Pulmonary Vascular Resistance"
    unit: "Wood Units"
    confidence: high
    status: confirmed
    source:
      - "ISHLT Guidelines"
      - "Heart transplant protocols"
      - "中国心脏移植共识2019"
    thresholds:
      target:
        operator: "<"
        value: 2.5
        description: "目标"
      warning:
        operator: ">"
        value: 2.5
        description: "警戒，需药物治疗"
      red_line:
        operator: ">"
        value: 4.0
        description: "可接受上限（需扩张剂反应性试验）"
      contraindication:
        operator: ">"
        value: 5.0
        description: "移植禁忌（共识）"
    baseline_reference: 2.0
    escalation_rule: "PVR > 2.5 → 肺血管扩张剂; PVR > 5.0 → 移植禁忌"
    notes: "受体端重要评估指标；共识：>5Wood禁忌，<4Wood可接受"

# -----------------------------------------------------------------------------
# 7. 冠脉灌注指标 (Coronary Perfusion)
# -----------------------------------------------------------------------------
coronary_perfusion:
  # 冠脉流量
  CF:
    name: "冠脉流量"
    name_en: "Coronary Flow"
    unit: "mL/min"
    confidence: high
    status: confirmed
    source:
      - "Prot_000 OCS Protocol"
      - "OCS操作手册"
    thresholds:
      target:
        min: 400
        max: 900
        description: "OCS目标范围"
    baseline_reference: 650
    notes: "OCS系统特有指标"

# -----------------------------------------------------------------------------
# 8. 术后监测指标 (Post-operative Monitoring)
# -----------------------------------------------------------------------------
postoperative:
  # 胸腔引流
  chest_drainage:
    name: "胸腔引流量"
    name_en: "Chest Drainage"
    unit: "mL/h"
    confidence: high
    status: confirmed
    source:
      - "Post-surgical protocols"
      - "ICU guidelines"
    thresholds:
      alarm:
        operator: ">"
        value: 200
        duration_hours: 6
        description: "持续6-8小时 >200mL/h 触发警报"
    baseline_reference: 50
    notes: "需要持续监测的时序指标"

# -----------------------------------------------------------------------------
# 9. 心肌力学指标 (Myocardial Mechanics)
# -----------------------------------------------------------------------------
myocardial_mechanics:
  # 最大压力变化率
  max_dPdt:
    name: "最大压力变化率"
    name_en: "Maximum dP/dt"
    unit: "mmHg/s"
    confidence: medium
    status: confirmed
    source:
      - "AHA Circulation - Assessment of Cardiac Contractility"
      - "Critical Care 2018 - dP/dtmax performance comparison"
      - "BMC Cardiovascular Disorders"
    thresholds:
      target:
        min: 1200
        max: 1800
        description: "正常范围（左心室）"
      warning:
        operator: "<"
        value: 1200
        description: "收缩力下降，心肌功能障碍"
      red_line:
        operator: "<"
        value: 1000
        description: "严重收缩功能障碍"
      enhanced:
        operator: ">"
        value: 2000
        description: "正性肌力药物作用/高动力状态"
    baseline_reference: 1400
    notes: "正常LV约1000-1600 mmHg/s；受前负荷影响；RV正常~250 mmHg/s"

  # 舒张时间常数
  tau_relaxation:
    name: "舒张时间常数"
    name_en: "Time Constant of Relaxation (Tau)"
    unit: "ms"
    confidence: medium
    status: confirmed
    source:
      - "Nagueh et al 2009 - Diastolic Function Guidelines"
      - "Grant et al 2015"
      - "PMC - Calculation of LV Relaxation Time Constant"
    thresholds:
      target:
        min: 30
        max: 45
        description: "正常范围"
      warning:
        operator: ">"
        value: 48
        description: "舒张功能障碍"
      red_line:
        operator: ">"
        value: 60
        description: "严重舒张功能障碍"
    baseline_reference: 40
    notes: "舒张功能评估金标准；>48ms为舒张功能障碍临床截断值"

  # 端收缩弹性
  Emax:
    name: "端收缩弹性"
    name_en: "End-Systolic Elastance (Ees)"
    unit: "mmHg/mL"
    confidence: medium
    status: confirmed
    source:
      - "Critical Care 2016 - LV function time-varying elastance"
      - "JACC - Noninvasive determination of Ees"
      - "PMC - Ventricular-Arterial Coupling"
    thresholds:
      target:
        min: 1.5
        max: 3.5
        description: "正常范围（非索引值）"
      normal_reference: 2.3
      warning_low:
        operator: "<"
        value: 1.5
        description: "收缩力下降"
      red_line:
        operator: "<"
        value: 1.0
        description: "严重收缩功能障碍"
    baseline_reference: 2.3
    notes: "正常2.3±1.0 mmHg/mL；索引值7.1±2.4 mmHg·mL⁻¹·m⁻²；负荷独立的收缩功能指标"

  # 端收缩压
  end_systolic_pressure:
    name: "端收缩压"
    name_en: "End-Systolic Pressure"
    unit: "mmHg"
    confidence: medium
    status: confirmed
    source:
      - "CV Physiology - Ventricular PV Relationship"
      - "Kelly et al 1992"
      - "ADInstruments PV Loop Guide"
    thresholds:
      target:
        min: 90
        max: 120
        description: "正常范围（约0.9×SBP）"
      warning_low:
        operator: "<"
        value: 80
        description: "低血压/收缩功能下降"
      warning_high:
        operator: ">"
        value: 140
        description: "后负荷增加"
    baseline_reference: 100
    notes: "通常约为收缩压的0.9倍；正常~100-108 mmHg"

  # 产生压力
  developed_pressure:
    name: "产生压力"
    name_en: "Developed Pressure (LVDP)"
    unit: "mmHg"
    confidence: medium
    status: confirmed
    source:
      - "Catheterization studies"
      - "Langendorff preparation references"
    thresholds:
      target:
        min: 80
        max: 120
        description: "正常范围（peak systolic - end-diastolic）"
      warning:
        operator: "<"
        value: 70
        description: "收缩功能下降"
      red_line:
        operator: "<"
        value: 50
        description: "严重收缩功能障碍"
    baseline_reference: 100
    notes: "= Peak Systolic - End-Diastolic Pressure；Langendorff模型常用指标"

  # 收缩时间/射血时间
  contraction_time:
    name: "左室射血时间"
    name_en: "Left Ventricular Ejection Time (LVET)"
    unit: "ms"
    confidence: medium
    status: confirmed
    source:
      - "Wiley - Systolic Time Intervals"
      - "AHA Circulation - Systolic Time Intervals in Heart Failure"
      - "Nature Hypertension Research"
    thresholds:
      target:
        min: 280
        max: 360
        description: "正常范围（校正后FTc 330-360ms）"
      warning_short:
        operator: "<"
        value: 280
        description: "射血时间缩短，可能心功能下降"
      warning_long:
        operator: ">"
        value: 400
        description: "射血时间延长"
    baseline_reference: 320
    notes: "心衰时射血时间缩短，前射血期延长"

  # 压力-容积面积/势能
  potential_energy_PVA:
    name: "压力-容积面积"
    name_en: "Pressure-Volume Area (PVA)"
    unit: "mmHg·mL"
    confidence: medium
    status: confirmed
    source:
      - "Suga et al - MVO2-PVA relationship"
      - "NCBI StatPearls - Myocardial Oxygen Demand"
      - "AJP Heart - MVO2 assessment"
    thresholds:
      description: "PVA = 外功(SW) + 势能(PE)，与心肌氧耗线性相关"
      notes: "主要用于相对变化评估，绝对值因个体差异大"
    baseline_reference: null
    notes: "MVO2与PVA线性相关(r=0.92)；效率=1/斜率，正常~40%"

# -----------------------------------------------------------------------------
# 10. 移植共识特异性指标 (Transplant Consensus)
# -----------------------------------------------------------------------------
transplant_consensus:
  # 跨肺压差 (Trans-Pulmonary Gradient)
  TPG:
    name: "跨肺压差"
    name_en: "Trans-Pulmonary Gradient"
    unit: "mmHg"
    confidence: high
    status: confirmed
    source:
      - "中国心脏移植共识2019"
      - "心脏外科学ch21"
    thresholds:
      target:
        operator: "<"
        value: 12
        description: "正常/可接受"
      warning:
        operator: ">"
        value: 12
        description: "需评估肺血管扩张剂反应"
      contraindication:
        operator: ">"
        value: 15
        description: "移植禁忌（共识：>14-15mmHg）"
    baseline_reference: 10
    notes: "TPG = mPAP - PCWP; >14-15mmHg为移植禁忌"

  # 肺动脉收缩压
  PASP:
    name: "肺动脉收缩压"
    name_en: "Pulmonary Artery Systolic Pressure"
    unit: "mmHg"
    confidence: high
    status: confirmed
    source:
      - "心脏外科学ch21"
      - "中国心脏移植共识2019"
    thresholds:
      target:
        operator: "<"
        value: 40
        description: "正常范围"
      warning:
        operator: ">"
        value: 50
        description: "右室难以承受"
      red_line:
        operator: ">"
        value: 60
        description: "明显右室功能障碍"
      contraindication:
        operator: ">"
        value: 70
        description: "移植禁忌"
    baseline_reference: 30
    notes: "共识：>50mmHg右室难承受，>60-70mmHg禁忌"

  # 肌酐
  Creatinine:
    name: "肌酐"
    name_en: "Creatinine"
    unit: "mg/dL"
    confidence: high
    status: confirmed
    source:
      - "心脏外科学ch21"
      - "免疫抑制规范"
    thresholds:
      target:
        operator: "<"
        value: 1.5
        description: "正常"
      warning:
        operator: ">"
        value: 1.7
        description: "肾功能不全，他克莫司需减量"
      red_line:
        operator: ">"
        value: 2.0
        description: "ATG替代钙调磷酸酶抑制剂"
    baseline_reference: 1.0
    escalation_rule: "Cr>1.7→CNI减量; Cr>2.0→ATG替代CNI"
    notes: "共识：>1.7减量，>2.0替代方案"

  # 肌酐清除率
  CrCl:
    name: "肌酐清除率"
    name_en: "Creatinine Clearance"
    unit: "mL/min"
    confidence: high
    status: confirmed
    source:
      - "心脏外科学ch21"
    thresholds:
      target:
        operator: ">"
        value: 60
        description: "肾功能可接受"
      warning:
        operator: "<"
        value: 50
        description: "肾功能不全"
      contraindication:
        operator: "<"
        value: 40
        description: "移植相对禁忌"
    baseline_reference: 80
    notes: "共识：<40-50mL/min为移植相对禁忌"

  # GFR
  GFR:
    name: "肾小球滤过率"
    name_en: "Glomerular Filtration Rate"
    unit: "mL/min/1.73m²"
    confidence: high
    status: confirmed
    source:
      - "心脏外科学ch21"
    thresholds:
      target:
        operator: ">"
        value: 60
        description: "正常"
      warning:
        operator: "<"
        value: 60
        description: "CKD监测"
    baseline_reference: 90
    escalation_rule: "GFR<60→CKD监测; 年降>4mL/min→警示"
    notes: "共识：<60需CKD监测，年下降>4mL/min/年为警示信号"

  # 胆红素
  Bilirubin:
    name: "胆红素"
    name_en: "Bilirubin"
    unit: "mg/dL"
    confidence: high
    status: confirmed
    source:
      - "心脏外科学ch21"
    thresholds:
      target:
        operator: "<"
        value: 1.2
        description: "正常"
      warning:
        operator: ">"
        value: 2.0
        description: "肝功能异常"
      red_line:
        operator: ">"
        value: 2.5
        description: "肝功能不全"
    baseline_reference: 0.8
    notes: "共识：>2.5mg/dL提示肝功能不全"

  # 供心冷缺血时间
  ColdIschemiaTime:
    name: "冷缺血时间"
    name_en: "Cold Ischemia Time"
    unit: "h"
    confidence: high
    status: confirmed
    source:
      - "供心获取规范"
      - "中国心脏移植共识2019"
    thresholds:
      target:
        operator: "<"
        value: 4
        description: "理想"
      accept:
        operator: "<"
        value: 6
        description: "标准可接受"
      red_line:
        operator: ">"
        value: 6
        description: "延长风险增加"
      reject:
        operator: ">"
        value: 8
        description: "最长极限"
    baseline_reference: 4
    notes: "共识：<6h标准，<8h最长极限"

  # 峰值摄氧量
  PeakVO2:
    name: "峰值摄氧量"
    name_en: "Peak Oxygen Consumption"
    unit: "mL/min/kg"
    confidence: high
    status: confirmed
    source:
      - "受者术前评估规范"
      - "中国心脏移植共识2019"
    thresholds:
      transplant_indication:
        operator: "<"
        value: 14
        description: "进入移植等待名单"
      urgent:
        operator: "<"
        value: 10
        description: "紧急移植指征"
      defer:
        operator: ">"
        value: 15
        description: "暂缓移植"
    baseline_reference: 20
    notes: "共识：<10-14进入等待名单，>15暂缓"

  # 供者左室壁厚度
  LVWallThickness:
    name: "左室壁厚度"
    name_en: "Left Ventricular Wall Thickness"
    unit: "mm"
    confidence: high
    status: confirmed
    source:
      - "供心获取规范"
    thresholds:
      target:
        operator: "<"
        value: 12
        description: "正常"
      reject:
        operator: ">"
        value: 14
        description: "严重左室肥厚，排除供心"
    baseline_reference: 10
    notes: "共识：>14mm排除供心"

  # 霉酚酸谷浓度
  MPA_Trough:
    name: "霉酚酸谷浓度"
    name_en: "MPA Trough Concentration"
    unit: "mg/L"
    confidence: medium
    status: confirmed
    source:
      - "免疫抑制规范"
    thresholds:
      therapeutic:
        operator: ">"
        value: 1.5
        description: "治疗浓度"
      subtherapeutic:
        operator: "<"
        value: 1.5
        description: "未达治疗剂量"
    baseline_reference: 2.0
    notes: "共识：<1.5mg/L未达治疗剂量"

# -----------------------------------------------------------------------------
# 11. 灌注调控参数 (Perfusion Setpoints)
# -----------------------------------------------------------------------------
perfusion_setpoints:
  # 灌注流量 (Perfusion Flow)
  Flow:
    name: "灌注流量"
    name_en: "Perfusion Flow"
    unit: "L/min"
    confidence: high
    status: confirmed
    indicator_type: setpoint
    source:
      - "CPB操作规范"
      - "中国心脏移植共识2019 - CPB流速4.2-4.8L/min"
    thresholds:
      target:
        min: 4.2
        max: 4.8
        description: "CPB标准灌注流量"
      warning:
        operator: "<"
        value: 3.8
        description: "流量偏低，组织灌注可能不足"
      red_line:
        operator: "<"
        value: 3.5
        description: "流量严重不足，需立即调整"
      warning_high:
        operator: ">"
        value: 5.2
        description: "流量偏高，注意水肿风险"
    baseline_reference: 4.5
    control: "离心泵/滚压泵转速"
    device: "CPB泵"
    escalation_rule: "Flow<3.8→检查管路/泵转速; Flow<3.5→立即调整泵参数+检查储血罐液面"
    notes: "共识：CPB期间流速4.2-4.8 L/min; 流量直接影响DO2和组织灌注"

  # 灌注温度 (Perfusion Temperature)
  Temperature:
    name: "灌注温度"
    name_en: "Perfusion Temperature"
    unit: "°C"
    confidence: high
    status: confirmed
    indicator_type: setpoint
    source:
      - "CPB温度管理指南"
      - "体外循环操作规范"
    thresholds:
      target:
        min: 34
        max: 37
        description: "常温灌注目标范围"
      hypothermic_phase:
        min: 20
        max: 28
        description: "低温保护阶段"
      rewarming_target:
        min: 36
        max: 37
        description: "复温目标"
      warning_high:
        operator: ">"
        value: 38
        description: "过热警告，可能导致组织损伤"
    baseline_reference: 22.0
    control: "热交换器"
    device: "变温水箱"
    notes: "温度影响范围最广（CVR、Tau、代谢率）; 升温速率需<1°C/5min; 水温-灌注液温差<10°C"

  # 灌注压 / 主动脉灌注压 (Aortic Driving Pressure)
  AoDP:
    name: "灌注压(AoDP)"
    name_en: "Aortic Driving Pressure"
    unit: "mmHg"
    confidence: high
    status: confirmed
    indicator_type: setpoint
    source:
      - "OCS操作手册"
      - "CPB灌注压管理规范"
    thresholds:
      target:
        min: 35
        max: 45
        description: "OCS标准灌注压"
      warning:
        operator: "<"
        value: 30
        description: "灌注压偏低，冠脉灌注不足风险"
      red_line:
        operator: "<"
        value: 25
        description: "灌注压严重不足，需立即干预"
      warning_high:
        operator: ">"
        value: 50
        description: "灌注压偏高，注意水肿"
    baseline_reference: 40
    control: "离心泵转速/反馈控制"
    device: "离心泵"
    escalation_rule: "AoDP<30→调整泵转速; AoDP<25→检查后负荷+冠脉插管位置"
    notes: "AoDP是冠脉灌注驱动压; 过高→组织水肿; 过低→心肌缺血"

  # 动脉氧分压 (Arterial PaO2) - 作为Setpoint
  PaO2:
    name: "动脉氧分压"
    name_en: "Arterial Partial Pressure of Oxygen"
    unit: "mmHg"
    confidence: high
    status: confirmed
    indicator_type: setpoint
    source:
      - "氧合器管理规范"
      - "AARC Clinical Practice Guideline"
    thresholds:
      target:
        min: 100
        max: 200
        description: "OCS/CPB灌注目标PaO2"
      warning:
        operator: "<"
        value: 80
        description: "PaO2偏低，组织供氧不足风险"
      red_line:
        operator: "<"
        value: 60
        description: "低氧血症，需立即调整氧合器"
      warning_high:
        operator: ">"
        value: 300
        description: "PaO2过高，氧中毒风险"
    baseline_reference: 150
    control: "氧合器FiO2/扫气流量"
    device: "氧合器"
    escalation_rule: "PaO2<80→调整FiO2↑/扫气流量↑; PaO2<60→紧急检查氧合器功能"
    notes: "PaO2影响CaO2和DO2; 过高可致氧中毒，过低致组织缺氧"

  # 血红蛋白 (Hemoglobin) - 灌注液管理
  Hemoglobin:
    name: "血红蛋白"
    name_en: "Hemoglobin"
    unit: "g/L"
    confidence: high
    status: confirmed
    indicator_type: setpoint
    source:
      - "CPB血液管理指南"
      - "STS/SCA Blood Conservation Guideline"
    thresholds:
      target:
        min: 40
        max: 50
        description: "CPB灌注期间目标Hb"
      warning:
        operator: "<"
        value: 35
        description: "Hb偏低，携氧能力不足"
      red_line:
        operator: "<"
        value: 30
        description: "严重贫血，需立即输血"
      warning_high:
        operator: ">"
        value: 55
        description: "Hb偏高，高粘滞风险"
    baseline_reference: 45
    control: "RBC添加/灌注液稀释"
    device: "储血罐"
    escalation_rule: "Hb<35→储血罐添加RBC; Hb<30→紧急输血"
    notes: "Hb直接影响CaO2; 低Hb→MVO2↓→心肌缺氧; 过高→粘滞→微循环障碍"

  # 起搏心率 (Pacing Rate)
  PacingRate:
    name: "起搏心率"
    name_en: "Pacing Rate"
    unit: "bpm"
    confidence: high
    status: confirmed
    indicator_type: setpoint
    source:
      - "心脏起搏指南"
      - "移植后起搏管理"
    thresholds:
      target:
        min: 100
        max: 110
        description: "移植心脏起搏目标心率"
      warning:
        operator: ">"
        value: 120
        description: "心率过快，增加心肌耗氧"
      warning_low:
        operator: "<"
        value: 90
        description: "心率偏低，CO可能不足"
    baseline_reference: 0
    control: "起搏器设定"
    device: "起搏器"
    notes: "移植心脏去神经化，常需临时起搏; 目标100-110bpm维持CO"

  # 多巴酚丁胺 (Dobutamine) - 正性肌力药
  Dobutamine:
    name: "多巴酚丁胺"
    name_en: "Dobutamine"
    unit: "μg/min"
    confidence: high
    status: confirmed
    indicator_type: setpoint
    source:
      - "正性肌力药物指南"
      - "心脏移植术后管理共识"
    thresholds:
      target:
        min: 2
        max: 6
        description: "常规剂量范围"
      warning_high:
        operator: ">"
        value: 8
        description: "高剂量，注意心律失常"
      red_line_high:
        operator: ">"
        value: 10
        description: "极高剂量，评估是否需要MCS"
    baseline_reference: 0
    control: "注射泵速率"
    device: "注射泵"
    escalation_rule: "Dobutamine>8→评估加用米力农/Levosimendan; >10→评估MCS"
    notes: "移植心脏对正性肌力药反应可能异常; 去神经化心脏对β受体直接激动有效"

  # 胰岛素 (Insulin) - 血糖管理
  Insulin:
    name: "胰岛素"
    name_en: "Insulin"
    unit: "U/h"
    confidence: high
    status: confirmed
    indicator_type: setpoint
    source:
      - "ICU血糖管理指南"
      - "ADA 2025 Diabetes Care in Hospital"
    thresholds:
      target:
        min: 1.5
        max: 3.0
        description: "常规输注速率"
      warning_high:
        operator: ">"
        value: 5.0
        description: "高剂量，注意低血糖风险"
    baseline_reference: 2.0
    control: "注射泵速率"
    device: "注射泵"
    notes: "灌注液含葡萄糖需胰岛素管理; 目标血糖7.8-10 mmol/L"

# -----------------------------------------------------------------------------
# 12. 血气分析补充指标 (Blood Gas Supplementary)
# -----------------------------------------------------------------------------
blood_gas_supplementary:
  # 动脉pH
  pH:
    name: "动脉pH值"
    name_en: "Arterial pH"
    unit: ""
    confidence: high
    status: confirmed
    indicator_type: readout
    source:
      - "血气分析临床指南"
      - "CPB酸碱管理规范"
    thresholds:
      target:
        min: 7.25
        max: 7.35
        description: "OCS/CPB灌注期间可接受pH范围"
      warning:
        operator: "<"
        value: 7.20
        description: "酸中毒警告"
      red_line:
        operator: "<"
        value: 7.15
        description: "严重酸中毒，心肌抑制风险"
      warning_high:
        operator: ">"
        value: 7.45
        description: "碱中毒"
    baseline_reference: 7.30
    escalation_rule: "pH<7.20→扫气排CO2或NaHCO3; pH<7.15→紧急纠酸"
    notes: "酸中毒影响心肌收缩力和药物效应; 区分呼吸性/代谢性"

  # 心肌氧耗 (MVO2)
  MVO2:
    name: "心肌氧耗"
    name_en: "Myocardial Oxygen Consumption"
    unit: "mLO₂/min/100g"
    confidence: medium
    status: confirmed
    indicator_type: readout
    source:
      - "心肌氧代谢文献"
      - "Suga PVA-MVO2 relationship"
    thresholds:
      target:
        min: 8.8
        max: 20
        description: "正常心肌氧耗范围"
      warning:
        operator: "<"
        value: 8.8
        description: "MVO2偏低，心肌代谢不足"
      red_line:
        operator: "<"
        value: 5
        description: "MVO2严重不足"
    baseline_reference: 6.5
    notes: "MVO2与PVA线性相关; 反映心肌做功和氧供匹配"
